name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Vite app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Init and add Capacitor Android
        run: |
          npx cap init "আমার কুষ্টিয়া" "com.rajshahi.app" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Generate icons with Python
        run: |
          pip install Pillow
          python3 << 'PYEOF'
          from PIL import Image
          import os
          img = Image.open("assets/icon-only.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
            path = f"android/app/src/main/res/{folder}"
            os.makedirs(path, exist_ok=True)
            r = img.resize((size,size), Image.LANCZOS)
            r.save(f"{path}/ic_launcher.png")
            r.save(f"{path}/ic_launcher_round.png")
            r.save(f"{path}/ic_launcher_foreground.png")
          PYEOF

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rajshahi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
